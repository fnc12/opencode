name: relay

on:
  push:
    branches:
      - dev
    paths:
      - "packages/relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "packages/relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: packages/relay/go.mod
          cache-dependency-path: packages/relay/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        timeout-minutes: 15
        run: go test ./...

      - name: Build
        run: go build ./cmd/relay ./cmd/connector
