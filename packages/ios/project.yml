name: OpenCode
options:
  bundleIdPrefix: studio.eugenezakharov
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "6.0"
targets:
  OpenCode:
    type: application
    platform: iOS
    sources:
      - OpenCode
    info:
      path: OpenCode/Info.plist
      properties:
        CFBundleDisplayName: Shubat
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Only HTTPS/standard crypto — exempt, so TestFlight builds skip the
        # per-build export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Shubat needs local network access to discover servers"
        NSCameraUsageDescription: "Shubat uses the camera to scan a pairing QR code"
        NSBonjourServices:
          - _opencode._tcp
        CFBundleURLTypes:
          - CFBundleURLName: studio.eugenezakharov.OpenCode
            CFBundleURLSchemes:
              - opencode
    settings:
      DEVELOPMENT_TEAM: QDTPG5DB79
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: studio.eugenezakharov.shubat
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Overridden per TestFlight upload with a unique, increasing value (epoch).
      CURRENT_PROJECT_VERSION: "1"
  OpenCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenCodeTests
    dependencies:
      - target: OpenCode
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: QDTPG5DB79
  OpenCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OpenCodeUITests
    dependencies:
      - target: OpenCode
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: QDTPG5DB79
schemes:
  OpenCode:
    build:
      targets:
        OpenCode: all
    test:
      targets:
        - OpenCodeTests
        - OpenCodeUITests
