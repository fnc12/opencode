name: OpenCode
options:
  bundleIdPrefix: studio.eugenezakharov
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "6.0"
targets:
  OpenCode:
    type: application
    platform: iOS
    sources:
      - OpenCode
    info:
      path: OpenCode/Info.plist
      properties:
        CFBundleDisplayName: Shubat
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Shubat needs local network access to discover servers"
        NSCameraUsageDescription: "Shubat uses the camera to scan a pairing QR code"
        NSBonjourServices:
          - _opencode._tcp
        CFBundleURLTypes:
          - CFBundleURLName: studio.eugenezakharov.OpenCode
            CFBundleURLSchemes:
              - opencode
    settings:
      DEVELOPMENT_TEAM: QDTPG5DB79
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: studio.eugenezakharov.shubat
  OpenCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenCodeTests
    dependencies:
      - target: OpenCode
    settings:
      GENERATE_INFOPLIST_FILE: YES
  OpenCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OpenCodeUITests
    dependencies:
      - target: OpenCode
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenCode:
    build:
      targets:
        OpenCode: all
    test:
      targets:
        - OpenCodeTests
        - OpenCodeUITests
